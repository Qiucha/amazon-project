<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two-criterion Interactive explorer</title>
  <style>
    :root {
      --ink: #1a1f24;
      --muted: #5c6670;
      --line: #d5dce3;
      --paper: #f7f8f6;
      --panel: #ffffff;
      --accent: #0f6b5c;
      --accent-soft: #d8efe9;
      --warn: #8a4b12;
      --warn-soft: #f3e6d4;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
      --sans: "IBM Plex Sans", "Source Sans 3", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    body { min-height: 100vh; }
    button, input, select { font: inherit; }
    [hidden] { display: none !important; }
    .token { font-family: var(--mono); font-size: 0.92em; }
    .hint { color: var(--muted); font-size: 0.82rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.35rem;
      border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.55rem;
      font-size: 0.78rem; background: var(--panel);
    }
    .pill.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .empty {
      border: 1px dashed #b9a48a; background: var(--warn-soft); color: var(--warn);
      padding: 1rem 1.1rem; border-radius: 6px;
    }
    .empty strong { display: block; margin-bottom: 0.25rem; }
    .status {
      font-size: 0.78rem; color: var(--muted); min-height: 1.2em;
    }
    .status.error { color: var(--warn); }
    table.branches {
      width: 100%; border-collapse: collapse; font-size: 0.88rem;
      font-family: var(--mono);
    }
    table.branches th, table.branches td {
      border-bottom: 1px solid var(--line); padding: 0.4rem 0.45rem; text-align: right;
      white-space: nowrap;
    }
    table.branches th:first-child, table.branches td:first-child,
    table.branches th:nth-child(2), table.branches td:nth-child(2),
    table.branches th.l, table.branches td.l { text-align: left; }
    table.branches tr.selected-row { background: var(--accent-soft); }
    table.branches th { color: var(--muted); font-weight: 600; font-size: 0.75rem; }
    .mode-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .mode-seg button {
      border: 0; background: var(--panel); padding: 0.4rem 0.75rem; cursor: pointer; color: var(--muted);
    }
    .mode-seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .knob { display: flex; flex-direction: column; gap: 0.25rem; min-width: 10rem; }
    .knob label { font-size: 0.78rem; color: var(--muted); }
    .knob .row { display: flex; align-items: center; gap: 0.55rem; }
    .knob input[type="range"] { flex: 1; }
    .knob .val { font-family: var(--mono); min-width: 3.2rem; }
    .pinned { font-size: 0.78rem; color: var(--muted); }
    .pinned span { font-family: var(--mono); color: var(--ink); }
    .shell { max-width: 1140px; margin: 0 auto; padding: 1rem 1.1rem 2rem; }
    header.page h1 { font-size: 1.25rem; margin: 0 0 0.2rem; font-weight: 650; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.85rem 1.25rem; align-items: end;
      margin: 0.9rem 0;
    }
    .map-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.75rem 0.85rem;
    }
    .panel h2 {
      margin: 0 0 0.25rem; font-size: 0.88rem; font-weight: 650;
    }
    .panel .why { margin: 0 0 0.55rem; font-size: 0.75rem; color: var(--muted); line-height: 1.35; }
    .span2 { grid-column: 1 / -1; }
    .chart-wrap { width: 100%; overflow: hidden; }
    .chart-wrap svg { display: block; width: 100%; height: auto; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 0.55rem 0.9rem; margin-top: 0.45rem;
      font-size: 0.72rem; color: var(--muted);
    }
    .legend i {
      display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 2px;
      margin-right: 0.25rem; vertical-align: -0.05rem;
    }
    .num-footer {
      margin-top: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.45rem 0.9rem;
      font-family: var(--mono); font-size: 0.78rem; align-items: center;
    }
    .num-footer span { color: var(--muted); }
    @media (max-width: 820px) {
      .map-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="page">
      <h1>Two-criterion Interactive explorer</h1>
      <p class="hint">Pinned illustration population · live <code>analyze_two_criterion_scenario</code> · free Q and/or w</p>
      <p class="status" id="status" aria-live="polite"></p>
    </header>
    <div class="toolbar" id="toolbar"></div>
    <div class="map-grid" id="map"></div>
  </div>
  <script>
    const B_COST = 1.0;
    const LAMBDA = { "00": 0.448, "01": 0.252, "10": 0.192, "11": 0.108 };

    const GLOSSARY = {
      S0: "Tutoring threshold S₀",
      S1: "Tutoring threshold S₁",
      F0: "Tutoring participation rate F(S₀)",
      F1: "Tutoring participation rate F(S₁)",
      mass: "Population tutoring mass",
      exp: "Aggregate tutoring expenditure",
      x00: "Admission probability x₀₀",
      x01: "Admission probability x₀₁",
      x10: "Admission probability x₁₀",
      x11: "Admission probability x₁₁",
      C0: "Credibility C₀",
      C1: "Credibility C₁",
      mu00: "Posterior evaluation μ₀₀",
      mu01: "Posterior evaluation μ₀₁",
      mu10: "Posterior evaluation μ₁₀",
      mu11: "Posterior evaluation μ₁₁",
      adm_a: "Admitted high-ability share",
      adm_d: "Admitted diversity share",
      regime: "Rationing-class regime (tight vs loose leftover)",
      stability: "Local stability",
      Q: "Quota Q",
      w: "Diversity weight w",
    };

    const state = {
      mode: "dual",
      freeQ: true,
      freeW: true,
      Q: 0.33,
      w: 0.25,
      analysis: null,
      pending: 0,
      error: null,
    };

    let debounceTimer = null;

    function fmt(v, digits = 3) {
      if (v == null || Number.isNaN(v)) return "—";
      return Number(v).toFixed(digits);
    }
    function title(token) {
      return GLOSSARY[token] || token;
    }

    function compactEq(eq) {
      const o = eq.outcomes;
      return {
        regime: eq.regime,
        stability: eq.stability,
        S0: o.tutoring_threshold_0,
        S1: o.tutoring_threshold_1,
        F0: o.tutoring_participation_rate_0,
        F1: o.tutoring_participation_rate_1,
        mass: o.population_tutoring_mass,
        exp: o.aggregate_tutoring_expenditure,
        x00: o.admission_probability_00,
        x01: o.admission_probability_01,
        x10: o.admission_probability_10,
        x11: o.admission_probability_11,
        C0: o.credibility_0,
        C1: o.credibility_1,
        mu00: o.posterior_evaluation_00,
        mu01: o.posterior_evaluation_01,
        mu10: o.posterior_evaluation_10,
        mu11: o.posterior_evaluation_11,
        adm_a: o.admitted_high_ability_share,
        adm_d: o.admitted_diversity_share,
      };
    }

    function selectedEq(analysis) {
      if (!analysis || analysis.selected_index == null) return null;
      const raw = analysis.equilibria[analysis.selected_index];
      return raw ? compactEq(raw) : null;
    }

    function observedMasses(eq) {
      const F0 = eq.F0, F1 = eq.F1;
      return {
        "00": LAMBDA["00"] * (1 - F0),
        "01": LAMBDA["01"] * (1 - F1),
        "10": LAMBDA["10"] + LAMBDA["00"] * F0,
        "11": LAMBDA["11"] + LAMBDA["01"] * F1,
      };
    }

    function svgTutoringCost(eq) {
      const W = 520, H = 168, padL = 42, padR = 16, padT = 18, padB = 36;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const xScale = (c) => padL + (c / B_COST) * plotW;
      const y0 = padT + plotH * 0.22;
      const y1 = padT + plotH * 0.62;
      const h = plotH * 0.28;
      const s0 = Math.max(0, Math.min(B_COST, eq.S0));
      const s1 = Math.max(0, Math.min(B_COST, eq.S1));
      const densTop = padT;
      const densH = plotH * 0.12;
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tutoring thresholds on uniform cost support">
        <rect x="${padL}" y="${densTop}" width="${plotW}" height="${densH}" fill="#eef1ef" stroke="#d5dce3"/>
        <text x="${padL}" y="${densTop - 4}" font-size="10" fill="#5c6670">uniform density on [0, B]</text>
        <rect x="${padL}" y="${y0}" width="${xScale(s0) - padL}" height="${h}" fill="#9fd0c4" opacity="0.85"/>
        <rect x="${padL}" y="${y0}" width="${plotW}" height="${h}" fill="none" stroke="#d5dce3"/>
        <line x1="${xScale(s0)}" y1="${y0 - 4}" x2="${xScale(s0)}" y2="${y0 + h + 4}" stroke="#1a1f24" stroke-width="2"/>
        <text x="${padL + 4}" y="${y0 + h / 2 + 4}" font-size="11" fill="#1a1f24">d=0 tutors</text>
        <text x="${xScale(s0) + 4}" y="${y0 - 6}" font-size="11" font-family="IBM Plex Mono, monospace" fill="#1a1f24">S0=${fmt(eq.S0)}</text>
        <rect x="${padL}" y="${y1}" width="${xScale(s1) - padL}" height="${h}" fill="#7aa3bd" opacity="0.85"/>
        <rect x="${padL}" y="${y1}" width="${plotW}" height="${h}" fill="none" stroke="#d5dce3"/>
        <line x1="${xScale(s1)}" y1="${y1 - 4}" x2="${xScale(s1)}" y2="${y1 + h + 4}" stroke="#1a1f24" stroke-width="2"/>
        <text x="${padL + 4}" y="${y1 + h / 2 + 4}" font-size="11" fill="#1a1f24">d=1 tutors</text>
        <text x="${Math.min(xScale(s1) + 4, W - padR - 70)}" y="${y1 - 6}" font-size="11" font-family="IBM Plex Mono, monospace" fill="#1a1f24">S1=${fmt(eq.S1)}</text>
        <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#5c6670"/>
        <text x="${padL}" y="${H - 12}" font-size="11" fill="#5c6670">c = 0</text>
        <text x="${padL + plotW}" y="${H - 12}" font-size="11" fill="#5c6670" text-anchor="end">c = B</text>
        <text x="${padL + plotW / 2}" y="${H - 12}" font-size="11" fill="#5c6670" text-anchor="middle">tutoring cost c</text>
      </svg>`;
    }

    function svgMuVsX(types) {
      const ordered = [...types].sort((p, q) => q.mu - p.mu || (q.a - p.a));
      const W = 520, H = 200, padL = 40, padR = 44, padT = 16, padB = 36;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const n = ordered.length;
      const gap = 12;
      const barW = (plotW - gap * (n - 1)) / n;
      const muMax = Math.max(1e-6, ...ordered.map((t) => t.mu), 1);
      const bars = ordered.map((t, i) => {
        const x = padL + i * (barW + gap);
        const h = (t.mu / muMax) * plotH;
        const y = padT + plotH - h;
        const cx = x + barW / 2;
        const cy = padT + plotH - t.x * plotH;
        return `
          <rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="#0f6b5c" opacity="0.85" rx="3"/>
          <circle cx="${cx}" cy="${cy}" r="5.5" fill="#8a4b12" stroke="#fff" stroke-width="1.5"/>
          <text x="${cx}" y="${H - 14}" font-size="12" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="#1a1f24">${t.key}</text>
          <text x="${cx}" y="${y - 4}" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="#5c6670">${fmt(t.mu, 2)}</text>`;
      }).join("");
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Posterior evaluation bars with admission probability dots">
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#d5dce3"/>
        <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#d5dce3"/>
        <line x1="${padL + plotW}" y1="${padT}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#d5dce3" stroke-dasharray="3 3"/>
        <text x="${padL - 6}" y="${padT + 8}" font-size="10" fill="#5c6670" text-anchor="end">μ</text>
        <text x="${padL + plotW + 6}" y="${padT + 8}" font-size="10" fill="#8a4b12">x</text>
        ${bars}
      </svg>`;
    }

    function svgQuotaStack(admitted, Q, isMarginal) {
      const W = 520, H = 120, padL = 16, padR = 16, padT = 28, padB = 40;
      const plotW = W - padL - padR;
      const y = padT, h = 36;
      const colors = { "11": "#0f6b5c", "10": "#3d6b8a", "01": "#7aa3bd", "00": "#b7c0c7" };
      let x = padL;
      const segs = admitted.filter((t) => t.seat > 1e-9).map((t) => {
        const w = Q > 0 ? (t.seat / Q) * plotW : 0;
        const node = `<g>
          <rect x="${x}" y="${y}" width="${Math.max(w, 0)}" height="${h}" fill="${colors[t.key] || "#999"}"
            ${isMarginal(t) ? 'stroke="#8a4b12" stroke-width="2" stroke-dasharray="4 2"' : 'stroke="none"'}/>
          ${w > 28 ? `<text x="${x + w / 2}" y="${y + h / 2 + 4}" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="#fff">${t.key}</text>` : ""}
        </g>`;
        x += w;
        return node;
      }).join("");
      const qMark = padL + plotW;
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked quota fill by observed type">
        <rect x="${padL}" y="${y}" width="${plotW}" height="${h}" fill="#eef1ef" stroke="#d5dce3"/>
        ${segs}
        <line x1="${qMark}" y1="${y - 6}" x2="${qMark}" y2="${y + h + 6}" stroke="#1a1f24" stroke-width="2"/>
        <text x="${qMark}" y="${y - 10}" font-size="11" text-anchor="end" fill="#1a1f24">Q = ${fmt(Q)}</text>
        <text x="${padL}" y="${H - 14}" font-size="11" fill="#5c6670">← higher μ</text>
        <text x="${padL + plotW}" y="${H - 14}" font-size="11" fill="#5c6670" text-anchor="end">lower μ →</text>
      </svg>`;
    }

    function svgAdmittedDonuts(eq) {
      const W = 520, H = 160;
      const donut = (cx, cy, r, share, label, sub) => {
        const C = 2 * Math.PI * r;
        const dash = Math.max(0, Math.min(1, share)) * C;
        return `<g>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c5cdd3" stroke-width="16"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0f6b5c" stroke-width="16"
            stroke-dasharray="${dash} ${C - dash}" stroke-linecap="butt"
            transform="rotate(-90 ${cx} ${cy})"/>
          <text x="${cx}" y="${cy - 2}" font-size="16" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="#1a1f24">${fmt(share, 2)}</text>
          <text x="${cx}" y="${cy + 14}" font-size="11" text-anchor="middle" fill="#5c6670">${label}</text>
          <text x="${cx}" y="${cy + r + 28}" font-size="11" text-anchor="middle" fill="#5c6670">${sub}</text>
        </g>`;
      };
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Admitted class composition donuts">
        ${donut(150, 70, 42, eq.adm_a, "adm_a", "share a=1 in admitted class")}
        ${donut(370, 70, 42, eq.adm_d, "adm_d", "share d=1 in admitted class")}
      </svg>`;
    }

    function meaningHero(eq, Q) {
      if (!eq) {
        return `<div class="empty span2"><strong>No selected equilibrium</strong>
          Largest locally stable by population tutoring mass found none. Charts stay blank; every-branch table still lists roots.</div>`;
      }
      const m = observedMasses(eq);
      const types = [
        { key: "10", a: 1, d: 0, x: eq.x10, mu: eq.mu10 },
        { key: "11", a: 1, d: 1, x: eq.x11, mu: eq.mu11 },
        { key: "00", a: 0, d: 0, x: eq.x00, mu: eq.mu00 },
        { key: "01", a: 0, d: 1, x: eq.x01, mu: eq.mu01 },
      ];
      const ranked = [...types].sort((p, q) => q.mu - p.mu || (q.a - p.a));
      const admitted = ranked.map((t) => ({ ...t, seat: m[t.key] * t.x, mass: m[t.key] }));
      const seatSum = admitted.reduce((s, t) => s + t.seat, 0);
      const isMarginal = (t) => t.x > 1e-9 && t.x < 1 - 1e-9;

      return `
        <div class="panel">
          <h2>1 · Tutoring on the cost axis</h2>
          <p class="why">Uniform costs on [0, B]. Vertical marks are tutoring thresholds S<sub>d</sub>; shaded area left of each mark is who tutors (participation F(S<sub>d</sub>)).</p>
          <div class="chart-wrap">${svgTutoringCost(eq)}</div>
          <div class="legend">
            <span><i style="background:#9fd0c4"></i>d=0 tutors</span>
            <span><i style="background:#7aa3bd"></i>d=1 tutors</span>
            <span><i style="background:#1a1f24;width:2px"></i>S<sub>d</sub> threshold</span>
          </div>
          <div class="num-footer"><span title="${title("mass")}">mass</span> <strong>${fmt(eq.mass)}</strong>
            <span title="${title("exp")}">exp</span> <strong>${fmt(eq.exp)}</strong></div>
        </div>
        <div class="panel">
          <h2>2 · Posterior ranking vs admission</h2>
          <p class="why">Bars: posterior evaluation μ. Dots on the right axis: admission probability x.</p>
          <div class="chart-wrap">${svgMuVsX(types)}</div>
          <div class="legend">
            <span><i style="background:#0f6b5c"></i>μ</span>
            <span><i style="background:#8a4b12;border-radius:99px"></i>x (right axis)</span>
          </div>
          <div class="num-footer"><span title="${title("C0")}">C0</span> <strong>${fmt(eq.C0)}</strong>
            <span title="${title("C1")}">C1</span> <strong>${fmt(eq.C1)}</strong>
            <span>w</span> <strong>${fmt(state.w, 2)}</strong></div>
        </div>
        <div class="panel">
          <h2>3 · Quota fill (m · x down the ranking)</h2>
          <p class="why">Stacked admitted mass by observed type, ordered by μ. Full width = quota Q. Hatched = marginal pool.</p>
          <div class="chart-wrap">${svgQuotaStack(admitted, Q, isMarginal)}</div>
          <div class="num-footer"><span>Σ m·x</span> <strong>${fmt(seatSum)}</strong>
            <span>Q</span> <strong>${fmt(Q)}</strong>
            <span class="pill sel">selected</span>
            <span class="pill" title="${title("regime")}">${eq.regime}</span>
            <span class="pill" title="${title("stability")}">${eq.stability}</span>
          </div>
        </div>
        <div class="panel">
          <h2>4 · Admitted class composition</h2>
          <p class="why">Shares inside the admitted class — high-ability (a=1) and diversity (d=1).</p>
          <div class="chart-wrap">${svgAdmittedDonuts(eq)}</div>
          <div class="legend">
            <span><i style="background:#0f6b5c"></i>a=1 / d=1</span>
            <span><i style="background:#c5cdd3"></i>complement</span>
          </div>
        </div>`;
    }

    function branchTable(analysis) {
      if (!analysis || !analysis.equilibria.length) {
        return `<p class="hint">No isolated roots at this (Q, w).</p>`;
      }
      const rows = analysis.equilibria.map((raw, i) => {
        const eq = compactEq(raw);
        const sel = analysis.selected_index === i;
        return `<tr class="${sel ? "selected-row" : ""}">
          <td class="l">${i + 1}</td>
          <td class="l">${sel ? "●" : ""}</td>
          <td title="${title("S0")}">${fmt(eq.S0)}</td>
          <td title="${title("S1")}">${fmt(eq.S1)}</td>
          <td title="${title("mass")}">${fmt(eq.mass)}</td>
          <td title="${title("x00")}">${fmt(eq.x00)}</td>
          <td title="${title("x01")}">${fmt(eq.x01)}</td>
          <td title="${title("x10")}">${fmt(eq.x10)}</td>
          <td title="${title("x11")}">${fmt(eq.x11)}</td>
          <td class="l" title="${title("regime")}">${eq.regime}</td>
          <td class="l" title="${title("stability")}">${eq.stability}</td>
        </tr>`;
      }).join("");
      return `<table class="branches">
        <thead><tr>
          <th class="l">branch</th><th class="l">sel</th>
          <th title="${title("S0")}">S0</th><th title="${title("S1")}">S1</th>
          <th title="${title("mass")}">mass</th>
          <th title="${title("x00")}">x00</th><th title="${title("x01")}">x01</th>
          <th title="${title("x10")}">x10</th><th title="${title("x11")}">x11</th>
          <th class="l">regime</th><th class="l">stability</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function modeControls() {
      return `
        <div class="mode-seg" role="group" aria-label="Knob mode">
          <button type="button" data-mode="single" aria-pressed="${state.mode === "single"}">Single knob</button>
          <button type="button" data-mode="dual" aria-pressed="${state.mode === "dual"}">Two knobs</button>
        </div>`;
    }

    function singleKnobPicker() {
      if (state.mode !== "single") return "";
      return `
        <div class="mode-seg" role="group" aria-label="Which parameter is free">
          <button type="button" data-free="Q" aria-pressed="${state.freeQ}">Free Q</button>
          <button type="button" data-free="w" aria-pressed="${state.freeW}">Free w</button>
        </div>`;
    }

    function knobHTML(which) {
      const free = which === "Q" ? (state.mode === "dual" || state.freeQ) : (state.mode === "dual" || state.freeW);
      const val = which === "Q" ? state.Q : state.w;
      const min = which === "Q" ? 0.05 : 0;
      const max = which === "Q" ? 0.95 : 1;
      const step = 0.01;
      if (!free) {
        return `
          <div class="knob">
            <label title="${title(which)}">${which} <span class="hint">(pinned)</span></label>
            <div class="row"><span class="val token">${fmt(val, 2)}</span></div>
          </div>`;
      }
      return `
        <div class="knob">
          <label title="${title(which)}">${which}</label>
          <div class="row">
            <input type="range" data-knob="${which}" min="${min}" max="${max}" step="${step}" value="${val}" />
            <span class="val token">${fmt(val, 2)}</span>
          </div>
        </div>`;
    }

    function setStatus() {
      const el = document.getElementById("status");
      if (state.error) {
        el.className = "status error";
        el.textContent = state.error;
        return;
      }
      el.className = "status";
      el.textContent = state.pending > 0 ? "Updating…" : "";
    }

    function render() {
      document.getElementById("toolbar").innerHTML = `
        <div>
          <div class="hint" style="margin-bottom:0.35rem">Mode</div>
          ${modeControls()}
        </div>
        ${singleKnobPicker()}
        ${knobHTML("Q")}
        ${knobHTML("w")}
        <div class="pinned">Pinned: <span>λ=(0.448,0.252,0.192,0.108)</span> · <span>B=1</span> · uniform F(c)=c/B</div>`;

      const eq = selectedEq(state.analysis);
      document.getElementById("map").innerHTML = `
        ${meaningHero(eq, state.Q)}
        <div class="panel span2">
          <h2>Every isolated equilibrium <span class="hint">(engine order · thin table)</span></h2>
          ${branchTable(state.analysis)}
        </div>`;
      setStatus();
      bindChrome();
    }

    function bindChrome() {
      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.onclick = () => {
          state.mode = btn.getAttribute("data-mode");
          if (state.mode === "single") {
            if (!state.freeQ && !state.freeW) { state.freeQ = true; state.freeW = false; }
            if (state.freeQ && state.freeW) { state.freeW = false; }
          }
          render();
        };
      });
      document.querySelectorAll("[data-free]").forEach((btn) => {
        btn.onclick = () => {
          const which = btn.getAttribute("data-free");
          state.freeQ = which === "Q";
          state.freeW = which === "w";
          render();
        };
      });
      document.querySelectorAll("[data-knob]").forEach((input) => {
        input.oninput = () => {
          const which = input.getAttribute("data-knob");
          const v = Number(input.value);
          if (which === "Q") state.Q = v; else state.w = v;
          render();
          scheduleAnalyze();
        };
      });
    }

    function scheduleAnalyze() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runAnalyze, 80);
    }

    async function runAnalyze() {
      const requestId = ++state.pending;
      state.error = null;
      setStatus();
      const payload = {
        university_quota: state.Q,
        diversity_weight: state.w,
      };
      try {
        const response = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json();
        if (requestId !== state.pending) return;
        if (!response.ok) {
          state.error = body.error || `HTTP ${response.status}`;
          state.analysis = null;
        } else {
          state.analysis = body;
          state.error = null;
        }
      } catch (err) {
        if (requestId !== state.pending) return;
        state.error = "Could not reach the explorer server.";
        state.analysis = null;
      } finally {
        if (requestId === state.pending) {
          state.pending = 0;
          render();
        }
      }
    }

    render();
    runAnalyze();
  </script>
</body>
</html>
